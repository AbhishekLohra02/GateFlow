# Runs on every PR and every push to main.
# This is the "PR gate" - nothing merges unless this passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Single source of truth for values used by more than one job. Changing the
# region in one place beats hunting for six hardcoded copies of it.
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: gateflow-app

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    # Needed by the ECR push steps at the end of this job. Declared here
    # rather than on a separate job on purpose: a separate job would have to
    # rebuild the image, and a rebuilt image is a DIFFERENT artifact. The
    # whole promotion model depends on the bytes that passed the tests being
    # the exact bytes that ship.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Tagged with the commit SHA, never ':latest'. An immutable tag means
      # you can always answer "which commit is this image?" and a rollback
      # has a real target to roll back TO.
      - name: Build image
        run: docker build -t gateflow-app:${{ github.sha }} ./app

      - name: Start container
        run: docker run -d -p 3000:3000 --name gateflow gateflow-app:${{ github.sha }}

      # Poll rather than `sleep 10`. A fixed sleep is either too short
      # (flaky failures) or too slow (wasted minutes on every run).
      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::app never became healthy"
          docker logs gateflow
          exit 1

      - name: Check the root endpoint
        run: curl -fsS http://localhost:3000

      # The claim "runs as non-root" is worthless unless it is verified.
      # If the USER directive ever gets dropped, this fails the build.
      - name: Verify the container does NOT run as root
        run: |
          actual=$(docker exec gateflow whoami)
          echo "container user: ${actual}"
          if [ "${actual}" != "appuser" ]; then
            echo "::error::expected 'appuser', got '${actual}'"
            exit 1
          fi

      - name: Report image size
        run: docker images gateflow-app

      # Trivy is just a container itself. Report-only for now (--exit-code 0)
      # so we can see the baseline; we tighten this to fail the build once
      # we've dealt with whatever the base image ships with.
      - name: Scan image for known vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              gateflow-app:${{ github.sha }}

      # `if: always()` - run even when an earlier step failed. Without this,
      # a failure gives you no logs from the thing that failed.
      - name: Container logs
        if: always()
        run: docker logs gateflow

      # -------------------------------------------------------------------
      # Publish to ECR. main ONLY.
      #
      # A pull request builds and tests the image but never publishes it.
      # Otherwise every push to every open PR fills a 500MB free-tier
      # registry with images that will never be deployed, and the lifecycle
      # policy starts expiring real releases to make room for abandoned
      # branches.
      # -------------------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Exchanges the STS credentials for a registry auth token and runs
      # `docker login` for you. The token is valid for 12 hours; there is no
      # registry password stored anywhere.
      - name: Log in to ECR
        id: ecr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      # Re-tags the image already built and verified above. `docker tag` is
      # a pointer operation - it does not rebuild or copy layers, so the
      # digest is unchanged and this is the same artifact that passed.
      - name: Tag and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          target="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "gateflow-app:${GITHUB_SHA}" "$target"
          docker push "$target"
          echo "pushed ${target}"
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo "\`${target}\`" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------
  # Terraform gate. Runs alongside the container build, not after it -
  # they are independent, so running them in parallel halves feedback time.
  #
  # A MATRIX, because there is now more than one stack. Each entry gets its
  # own runner, so both stacks plan in parallel and each reports its own
  # pass/fail in the PR checks rather than one combined result.
  # ---------------------------------------------------------------------
  terraform:
    name: terraform (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      # Do NOT abort the other stack when one fails. The default (true)
      # cancels siblings on first failure, so a broken dev plan would hide
      # whether shared was fine - exactly the information you need.
      fail-fast: false

      matrix:
        include:
          - name: shared
            stack: terraform/shared
            # shared does not DECLARE image_tag. Passing a variable a stack
            # has not declared is a hard error, not a warning, so per-stack
            # vars live here rather than as one blanket flag.
            tf_vars: ""
          - name: dev
            stack: terraform/environments/dev
            tf_vars: -var=image_tag=${{ github.sha }}
          - name: staging
            stack: terraform/environments/staging
            tf_vars: -var=image_tag=${{ github.sha }}
          - name: prod
            stack: terraform/environments/prod
            tf_vars: -var=image_tag=${{ github.sha }}

    # Least privilege, declared per job rather than per workflow.
    #
    # id-token: write is what lets this job request an OIDC token from
    # GitHub to trade for temporary AWS credentials. Without it the
    # configure-aws-credentials step fails with a confusing "Credentials
    # could not be loaded" - the #1 OIDC setup error.
    #
    # Naming ANY permission here drops every other permission to none.
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: ${{ matrix.stack }}

    steps:
      - uses: actions/checkout@v4

      # No long-lived AWS_ACCESS_KEY_ID anywhere. This exchanges a
      # short-lived GitHub identity token for STS credentials that expire in
      # about an hour and cannot be replayed.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"

      # Cheapest possible check, and it keeps diffs about behaviour instead
      # of whitespace. Runs against the whole tree so it covers the modules
      # too, not just this stack.
      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Init
        run: terraform init

      # Offline: syntax, types, references. Catches a typo in seconds
      # without ever calling AWS.
      - name: Validate
        run: terraform validate

      # The actual gate. Plan talks to AWS, compares real infrastructure
      # against the config, and reports the delta.
      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan ${{ matrix.tf_vars }}

      - name: Publish plan to the run summary
        if: always()
        run: |
          echo '### Terraform plan - ${{ matrix.name }}' >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan >> $GITHUB_STEP_SUMMARY || echo 'plan failed' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------
  # Apply the SHARED stack. main only.
  #
  # Deliberately NOT in a matrix with dev: the dev stack READS shared's
  # state to get the ECR URL, so shared must finish first. Matrix entries
  # run in parallel and would race.
  # ---------------------------------------------------------------------
  terraform-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-verify, terraform]

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    # Two merges in quick succession would otherwise apply at once. The S3
    # lock would make the second fail partway through; this queues it.
    # cancel-in-progress stays FALSE - killing an apply mid-flight leaves
    # resources created but unrecorded in state, the worst outcome there is.
    concurrency:
      group: terraform-apply-shared
      cancel-in-progress: false

    defaults:
      run:
        working-directory: terraform/shared

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"

      - name: Init
        run: terraform init

      # -auto-approve because there is no human at a terminal. The review
      # happened on the PR, where the plan was posted to the run summary.
      - name: Apply
        run: terraform apply -auto-approve -input=false

      - name: Show outputs
        run: terraform output

  # ---------------------------------------------------------------------
  # PROMOTION. main only.
  #
  # The same image tag - this commit's SHA - flows through all three
  # environments. Nothing is rebuilt between them. The bytes that passed
  # dev are the bytes that reach prod, which is the only thing that makes
  # testing in dev say anything about prod.
  #
  # `needs` makes the chain sequential. Without it all three would deploy in
  # parallel and prod would ship code that had never been proven anywhere.
  # ---------------------------------------------------------------------
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [terraform-apply]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      stack: terraform/environments/dev
      name_prefix: gateflow-dev
      image_tag: ${{ github.sha }}
      expected_version: dev
    # Reusable workflows do NOT inherit secrets automatically - a called
    # workflow gets nothing unless it is passed. `inherit` hands over the
    # caller's secrets, which is what lets it assume the AWS role.
    secrets: inherit

  # Only runs if dev deployed AND its smoke test passed. A broken build
  # stops here.
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-dev]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      stack: terraform/environments/staging
      name_prefix: gateflow-staging
      image_tag: ${{ github.sha }}
      expected_version: staging
    secrets: inherit

  # ---------------------------------------------------------------------
  # PRODUCTION - THE APPROVAL GATE.
  #
  # Nothing in this job definition pauses it. The pause comes from the
  # `prod` GitHub Environment having "Required reviewers" configured: the
  # job is held before its first step runs until a human approves it in the
  # Actions UI.
  #
  # Deliberately NOT a workflow condition or an input. Keeping the gate as
  # environment configuration rather than code means changing who may
  # approve production does not require a pull request to the pipeline -
  # and, more importantly, someone cannot remove the gate by editing this
  # file, because the rule lives on the environment, not here.
  # ---------------------------------------------------------------------
  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      stack: terraform/environments/prod
      name_prefix: gateflow-prod
      image_tag: ${{ github.sha }}
      expected_version: prod
    secrets: inherit
