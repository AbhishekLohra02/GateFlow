# Runs on every PR and every push to main.
# This is the "PR gate" - nothing merges unless this passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Tagged with the commit SHA, never ':latest'. An immutable tag means
      # you can always answer "which commit is this image?" and a rollback
      # has a real target to roll back TO.
      - name: Build image
        run: docker build -t gateflow-app:${{ github.sha }} ./app

      - name: Start container
        run: docker run -d -p 3000:3000 --name gateflow gateflow-app:${{ github.sha }}

      # Poll rather than `sleep 10`. A fixed sleep is either too short
      # (flaky failures) or too slow (wasted minutes on every run).
      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::app never became healthy"
          docker logs gateflow
          exit 1

      - name: Check the root endpoint
        run: curl -fsS http://localhost:3000

      # The claim "runs as non-root" is worthless unless it is verified.
      # If the USER directive ever gets dropped, this fails the build.
      - name: Verify the container does NOT run as root
        run: |
          actual=$(docker exec gateflow whoami)
          echo "container user: ${actual}"
          if [ "${actual}" != "appuser" ]; then
            echo "::error::expected 'appuser', got '${actual}'"
            exit 1
          fi

      - name: Report image size
        run: docker images gateflow-app

      # Trivy is just a container itself. Report-only for now (--exit-code 0)
      # so we can see the baseline; we tighten this to fail the build once
      # we've dealt with whatever the base image ships with.
      - name: Scan image for known vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              gateflow-app:${{ github.sha }}

      # `if: always()` - run even when an earlier step failed. Without this,
      # a failure gives you no logs from the thing that failed.
      - name: Container logs
        if: always()
        run: docker logs gateflow

  # ---------------------------------------------------------------------
  # Terraform gate. Runs alongside the container build, not after it -
  # they are independent, so running them in parallel halves feedback time.
  # ---------------------------------------------------------------------
  terraform:
    runs-on: ubuntu-latest

    # Least privilege, declared per job rather than per workflow.
    #
    # id-token: write is what lets this job request an OIDC token from
    # GitHub to trade for temporary AWS credentials. Without it the
    # configure-aws-credentials step fails with a confusing "Credentials
    # could not be loaded" - the #1 OIDC setup error.
    #
    # contents: read is the minimum needed to check out the code. Note that
    # naming ANY permission here drops every other permission to none,
    # which is the point.
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: terraform/shared

    steps:
      - uses: actions/checkout@v4

      # TEMPORARY - remove once OIDC is confirmed working.
      # Prints the claims AWS is matching the trust policy against, and the
      # LENGTH of the role secret (GitHub masks the value itself). This is
      # the only way to see why an assume-role was refused: AWS deliberately
      # returns the same "Not authorized" for a wrong ARN, a missing role and
      # a failed condition, so it never tells you which one it was.
      - name: DEBUG - OIDC claims and secret shape
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString())
            core.info(`sub        = ${claims.sub}`)
            core.info(`aud        = ${claims.aud}`)
            core.info(`repository = ${claims.repository}`)
            core.info(`issuer     = ${claims.iss}`)

      - name: DEBUG - is the secret present
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "AWS_ROLE_ARN length: ${#ROLE}  (expected 54)"
          echo "starts with arn:aws:iam:: ? $(case "$ROLE" in arn:aws:iam::*) echo yes;; *) echo NO;; esac)"

      # No long-lived AWS_ACCESS_KEY_ID anywhere. This exchanges a
      # short-lived GitHub identity token for STS credentials that expire in
      # about an hour and cannot be replayed. Leaked static keys in CI are
      # the most common way cloud accounts get compromised, and they never
      # expire on their own.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Confirm which AWS identity we assumed
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"

      # Formatting is not cosmetic here - it is the cheapest possible check
      # and it keeps diffs about behaviour instead of whitespace.
      # -check fails rather than rewriting; -recursive covers subdirectories.
      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: terraform

      # Connects to the S3 backend. This is also the step that proves the
      # bucket, the backend config and the IAM permissions all line up.
      - name: Init
        run: terraform init

      # Validate is offline: syntax, types, references. Catches a typo in
      # seconds without ever calling AWS.
      - name: Validate
        run: terraform validate

      # The actual gate. Plan talks to AWS, compares real infrastructure
      # against the config, and reports the delta.
      #
      # -input=false: never wait for an interactive prompt. Without it a
      # missing variable hangs the runner until it times out instead of
      # failing fast.
      # -no-color: the ANSI escapes are unreadable in Actions logs.
      - name: Plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      # Put the plan in the run summary so it is readable without expanding
      # log groups - and so a reviewer can see the intended change.
      - name: Publish plan to the run summary
        if: always()
        run: |
          echo '### Terraform plan' >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan >> $GITHUB_STEP_SUMMARY || echo 'plan failed' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
